<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Seja Bem-Vindo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-100">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
    </div>

    <main class="w-full max-w-md relative z-10 my-8">
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 transition-all">

            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 mb-4 border border-indigo-500/20">
                    <i class="fa-solid fa-user-plus text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Seja Bem-Vindo!!</h2>
                <p class="text-sm text-slate-400 mt-1">Preencha os campos para se cadastrar</p>
            </div>

            <form method="post" action="../../register/register.php" class="space-y-4">
                <div>
                    <label for="usuario"
                        class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
                        Usuário
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
                        E-mail
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" placeholder="Digite seu email" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label for="telefone"
                        class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
                        Telefone
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label for="senha" class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-1.5">
                        Senha
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-950/50 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                        <button type="button" onclick="toggleSenha('senha', 'eye-icon')"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 transition-colors">
                            <i id="eye-icon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl shadow-lg shadow-indigo-600/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition-all duration-200 flex items-center justify-center space-x-2">
                        <span>Registrar</span>
                        <i class="fa-solid fa-check text-sm"></i>
                    </button>
                </div>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
                <span class="text-sm text-slate-400">
                    Já tem uma conta?
                    <a href="../index.html"
                        class="text-indigo-400 hover:text-indigo-300 font-medium hover:underline transition-colors">
                        Faça login
                    </a>
                </span>
            </div>

        </div>
    </main>

    <script>
        function toggleSenha(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>

</html>
