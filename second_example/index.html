<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-slate-950">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Integrador</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>

<body
    class="h-full font-sans antialiased text-slate-100 flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <!-- Glowing background blob effect -->
    <div
        class="absolute -z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] sm:w-[500px] h-[350px] sm:h-[500px] bg-blue-600/20 rounded-full blur-3xl pointer-events-none">
    </div>

    <div class="w-full max-w-md">
        <!-- Card Container -->
        <div
            class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 shadow-2xl rounded-2xl p-8 sm:p-10 space-y-8 relative overflow-hidden">

            <!-- Decorative top border line -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500">
            </div>

            <!-- Header / Title -->
            <div class="text-center space-y-2">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 mb-2 ring-1 ring-blue-500/20">
                    <i class="fa-solid fa-lock text-xl"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Acesse sua conta</h2>
                <p class="text-sm text-slate-400">Entre com seus dados para prosseguir</p>
            </div>

            <!-- Form -->
            <form method="post" action="index.php" class="space-y-5">

                <!-- Usuario Input -->
                <div class="space-y-1.5">
                    <label for="usuario" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Usuário
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-regular fa-user text-sm"></i>
                        </div>
                        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required
                            class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                    </div>
                </div>

                <input type="text" id="motivo" name="motivo" value="secondModel" required
                            class="hidden">

                <input type="text" id="motivo" name="motivo" value="firstModel" required
                            class="hidden">

                <!-- Senha Input -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between">
                        <label for="senha" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                            Senha
                        </label>
                    </div>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required
                            class="w-full pl-10 pr-10 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                        <button type="button" id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none transition"
                            aria-label="Mostrar senha">
                            <i class="fa-regular fa-eye text-sm" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-lg shadow-blue-600/30 transition duration-200 flex items-center justify-center gap-2 group cursor-pointer">
                        <span>Entrar</span>
                        <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </form>

            <!-- Anchor link / Criar conta -->
            <div class="text-center pt-2 border-t border-slate-800/60">
                <a href="register/register.html"
                    class="text-xs text-slate-400 hover:text-blue-400 font-medium transition duration-200 inline-flex items-center gap-1.5">
                    <span>Não tem senha?</span>
                    <span class="text-blue-400 underline underline-offset-4 font-semibold">Crie sua conta</span>
                </a>
            </div>

        </div>

        <!-- Footer subtle note -->
        <p class="text-center text-xs text-slate-600 mt-6">
            &copy; Projeto Integrador. Todos os direitos reservados.
        </p>
    </div>

    <!-- Inline Script for password toggle functionality -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const senhaInput = document.getElementById('senha');
            const eyeIcon = document.getElementById('eyeIcon');

            if (togglePassword && senhaInput && eyeIcon) {
                togglePassword.addEventListener('click', () => {
                    const isPassword = senhaInput.getAttribute('type') === 'password';
                    senhaInput.setAttribute('type', isPassword ? 'text' : 'password');

                    if (isPassword) {
                        eyeIcon.classList.remove('fa-eye');
                        eyeIcon.classList.add('fa-eye-slash');
                    } else {
                        eyeIcon.classList.remove('fa-eye-slash');
                        eyeIcon.classList.add('fa-eye');
                    }
                });
            }
        });
    </script>
</body>

</html>
